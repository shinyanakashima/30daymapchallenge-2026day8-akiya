function fmtM(n) {
  const m = n / 1e6;
  return m >= 1 ? `${m.toFixed(m >= 10 ? 1 : 2)} million` : `${Math.round(n).toLocaleString("en")}`;
}
function fmtJ(n) {
  n = Math.round(n);
  if (n >= 1e8) { const oku = Math.floor(n / 1e8), man = Math.round((n % 1e8) / 1e4); return `${oku}億${man.toLocaleString("ja")}万人`; }
  if (n >= 1e4) return `${Math.round(n / 1e4).toLocaleString("ja")}万人`;
  return `${n.toLocaleString("ja")}人`;
}
const fmtN = (n, lang) => Math.round(n).toLocaleString(lang === "ja" ? "ja" : "en");

const state = { lang: "en", scen: "B", rate: 0.1, sel: 5 };
let DATA, GEO, COAST, byCode = {};

// ------------------------------------------------------------- model
function compute() {
  const r = state.rate, P = DATA.prefs;
  const add = {}, now = {}, out = {};
  P.forEach(p => { add[p.code] = Math.round(p.movers * r); now[p.code] = p.pop2025; });
  const res = {};
  P.forEach(p => { res[p.code] = { pop: now[p.code] + add[p.code], add: add[p.code], out: 0 }; });
  if (state.scen === "B") {
    const T = DATA.tokyo;
    const total = P.filter(p => p.code !== T).reduce((s, p) => s + add[p.code], 0);
    res[T] = { pop: now[T] - total, add: 0, out: total };
  } else if (state.scen === "C") {
    const S = DATA.sources_c;
    const total = P.filter(p => !S.includes(p.code)).reduce((s, p) => s + add[p.code], 0);
    const sum = S.reduce((s, c) => s + now[c], 0);
    const exact = S.map(c => total * now[c] / sum);
    const alloc = exact.map(Math.floor);
    let rest = total - alloc.reduce((a, b) => a + b, 0);
    exact.map((e, i) => [e - alloc[i], i]).sort((a, b) => b[0] - a[0]).slice(0, rest).forEach(([, i]) => alloc[i]++);
    S.forEach((c, i) => { res[c] = { pop: now[c] - alloc[i], add: 0, out: alloc[i] }; });
  }
  P.forEach(p => { res[p.code].year = returnYear(res[p.code].pop, now[p.code], p.series); });
  let natPop = DATA.national.pop2025;
  if (state.scen === "A") natPop += P.reduce((s, p) => s + add[p.code], 0);
  const nat = { pop: natPop, year: state.scen === "A" ? returnYear(natPop, DATA.national.pop2025, DATA.national.series) : "same" };
  const movers = P.reduce((s, p) => s + Math.round(p.movers * r), 0);
  return { res, nat, movers };
}

function returnYear(newPop, nowPop, series) {
  if (newPop === nowPop) return "same";
  const ys = DATA.years.filter(y => series[y] != null);
  if (newPop > nowPop) {
    const hit = ys.filter(y => series[y] >= newPop);
    return hit.length ? Math.max(...hit) : "record";
  }
  const hit = ys.filter(y => series[y] <= newPop);
  return hit.length ? Math.max(...hit) : "low";
}

function cls(y) {
  if (y === "same") return "none";
  if (y === "record") return "new";
  if (y === "low") return "lt1980";
  return y >= 2015 ? "2015" : y >= 2005 ? "2005" : y >= 1980 ? "1980" : "lt1980";
}

// ------------------------------------------------------------- 3D scene
// Layers: today (2025) at the bottom, older census years stacked above,
// "new record" just below today. Each prefecture is a thin slab that
// moves to the layer of its return year.
const STEP = 4;            // height per 5 years
const yOfYear = y => (2025 - y) / 5 * STEP;
const Y_RECORD = -STEP * 1.6;
const C_UP = new THREE.Color("#1f8a4c"), C_DOWN = new THREE.Color("#c8312a"), C_SAME = new THREE.Color("#fbfaf6");
let renderer, labelRenderer, scene, camera, controls, stage;
const meshes = {}, stalks = {}, plabels = {}, yearLabels = {};
let S, X0, Z0, raycaster = new THREE.Raycaster(), pointer = new THREE.Vector2(), lastR = null;

function toXZ([x, y]) { return [(x - X0) * S, -(y - Z0) * S]; }

function buildScene() {
  stage = document.getElementById("stage");
  const w = stage.clientWidth, h = stage.clientHeight;
  try {
    renderer = new THREE.WebGLRenderer({ antialias: true });
  } catch (e) {
    stage.insertAdjacentHTML("beforeend", '<p class="nogl">WebGL is not available. See the poster images below.</p>');
    return false;
  }
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(w, h);
  renderer.setClearColor(0xf4f1ea);
  stage.appendChild(renderer.domElement);
  labelRenderer = new CSS2DRenderer();
  labelRenderer.setSize(w, h);
  labelRenderer.domElement.className = "css2d";
  stage.appendChild(labelRenderer.domElement);

  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(32, w / h, 1, 2000);
  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.maxPolarAngle = Math.PI * 0.49;
  controls.minDistance = 60; controls.maxDistance = 600;

  scene.add(new THREE.HemisphereLight(0xffffff, 0xd9d3c4, 2.2));
  const sun = new THREE.DirectionalLight(0xffffff, 1.3); sun.position.set(-60, 120, 80); scene.add(sun);

  // projection: frame -> about 100 units wide
  const [x0, y0, x1, y1] = DATA.frame;
  S = 100 / (x1 - x0); X0 = (x0 + x1) / 2; Z0 = (y0 + y1) / 2;

  // shapes
  const shapesOf = f => {
    const polys = f.geometry.type === "Polygon" ? [f.geometry.coordinates] : f.geometry.coordinates;
    return polys.map(poly => {
      const sh = new THREE.Shape(poly[0].map(c => { const [x, z] = toXZ(c); return new THREE.Vector2(x, -z); }));
      poly.slice(1).forEach(h => sh.holes.push(new THREE.Path(h.map(c => { const [x, z] = toXZ(c); return new THREE.Vector2(x, -z); }))));
      return sh;
    });
  };
  // outline of all prefectures, reused on every layer
  const linePts = [];
  GEO.features.forEach(f => {
    const polys = f.geometry.type === "Polygon" ? [f.geometry.coordinates] : f.geometry.coordinates;
    polys.forEach(poly => poly.forEach(ring => {
      for (let i = 0; i < ring.length - 1; i++) {
        const [ax, az] = toXZ(ring[i]), [bx, bz] = toXZ(ring[i + 1]);
        linePts.push(ax, 0, az, bx, 0, bz);
      }
    }));
  });
  const outlineGeo = new THREE.BufferGeometry();
  outlineGeo.setAttribute("position", new THREE.Float32BufferAttribute(linePts, 3));
  const coastPts = [];
  COAST.forEach(ln => { for (let i = 0; i < ln.length - 1; i++) { const [ax, az] = toXZ(ln[i]), [bx, bz] = toXZ(ln[i + 1]); coastPts.push(ax, 0, az, bx, 0, bz); } });
  const coastGeo = new THREE.BufferGeometry();
  coastGeo.setAttribute("position", new THREE.Float32BufferAttribute(coastPts, 3));

  // the year ruler stands in the Pacific, east of the Kanto region
  const corner = toXZ([620000, -380000]);
  const ruler = new THREE.Line(new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(corner[0], Y_RECORD, corner[1]), new THREE.Vector3(corner[0], yOfYear(1920), corner[1])]),
    new THREE.LineBasicMaterial({ color: 0x000000 }));
  scene.add(ruler);
  DATA.years.forEach(yr => addLayer(coastGeo, yOfYear(yr), yr, corner));
  addLayer(outlineGeo, 0, 2025, corner);
  addLayer(coastGeo, Y_RECORD, "record", corner);

  // prefecture slabs
  GEO.features.forEach(f => {
    const code = f.properties.code;
    const geo = new THREE.ExtrudeGeometry(shapesOf(f), { depth: 0.9, bevelEnabled: false });
    geo.rotateX(-Math.PI / 2);
    const mat = new THREE.MeshStandardMaterial({ color: C_SAME, roughness: .85, metalness: 0 });
    const m = new THREE.Mesh(geo, mat);
    m.userData = { code, y: 0, target: 0 };
    const edges = new THREE.LineSegments(new THREE.EdgesGeometry(geo, 30), new THREE.LineBasicMaterial({ color: 0x000000, transparent: true, opacity: .55 }));
    m.add(edges);
    scene.add(m);
    meshes[code] = m;
    // stalk from today's layer to the slab
    const c = toXZ(DATA.centers[code]);
    const sg = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(c[0], 0, c[1]), new THREE.Vector3(c[0], 0, c[1])]);
    const st = new THREE.Line(sg, new THREE.LineBasicMaterial({ color: 0x000000, transparent: true, opacity: .45 }));
    scene.add(st);
    stalks[code] = { line: st, x: c[0], z: c[1] };
    // label (key prefectures always, others when selected)
    const div = document.createElement("div"); div.className = "pl";
    const lab = new CSS2DObject(div); lab.center.set(0.5, 1.4);
    lab.position.set(c[0], 0, c[1]);
    scene.add(lab);
    plabels[code] = lab;
  });

  setCamera();
  document.getElementById("reset").addEventListener("click", setCamera);
  addEventListener("resize", onResize);
  renderer.domElement.addEventListener("pointermove", e => pick(e, false));
  let down = null;
  renderer.domElement.addEventListener("pointerdown", e => { down = [e.clientX, e.clientY]; });
  renderer.domElement.addEventListener("pointerup", e => {
    if (down && Math.hypot(e.clientX - down[0], e.clientY - down[1]) < 6) pick(e, true);
    down = null;
  });
  animate();
  return true;
}

function addLayer(geo, y, yr, corner) {
  const mat = new THREE.LineBasicMaterial({ color: 0x000000, transparent: true, opacity: yr === 2025 ? .8 : .16 });
  const lines = new THREE.LineSegments(geo, mat);
  lines.position.y = y;
  scene.add(lines);
  // tick on the year ruler
  const tk = new THREE.Line(new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(corner[0], y, corner[1]), new THREE.Vector3(corner[0] + 2.2, y, corner[1])]),
    new THREE.LineBasicMaterial({ color: 0x000000 }));
  scene.add(tk);
  if (yr === 2025 || yr === "record") {
    const plane = new THREE.Mesh(new THREE.PlaneGeometry(108, 118), new THREE.MeshBasicMaterial({
      color: yr === 2025 ? 0xe4dfd2 : 0xf0ebe0, transparent: true, opacity: yr === 2025 ? .45 : .3, side: THREE.DoubleSide, depthWrite: false }));
    plane.rotation.x = -Math.PI / 2; plane.position.set(0, y - 0.05, -2);
    scene.add(plane);
  }
  const div = document.createElement("div");
  div.className = "yl" + (yr === 2025 ? " now" : "");
  const lab = new CSS2DObject(div);
  lab.center.set(0, 0.5);
  lab.position.set(corner[0] + 3, y, corner[1]);
  scene.add(lab);
  yearLabels[yr] = { lab, div, mat };
}

function setCamera() {
  const mid = yOfYear(1980);
  const k = Math.max(1, 0.8 / camera.aspect);
  controls.target.set(-4, mid - 4, 0);
  camera.position.set(-4 + 154 * k, mid - 4 + 74 * k, 235 * k);
  controls.update();
}

function onResize() {
  if (!renderer) return;
  const w = stage.clientWidth, h = stage.clientHeight;
  camera.aspect = w / h; camera.updateProjectionMatrix();
  renderer.setSize(w, h); labelRenderer.setSize(w, h);
}

function pick(e, click) {
  const r = renderer.domElement.getBoundingClientRect();
  pointer.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  raycaster.setFromCamera(pointer, camera);
  const hit = raycaster.intersectObjects(Object.values(meshes), false)[0];
  renderer.domElement.style.cursor = hit ? "pointer" : "grab";
  if (hit && (click || (e.pointerType === "mouse" && matchMedia("(hover: hover)").matches))) {
    if (hit.object.userData.code !== state.sel) select(hit.object.userData.code);
  }
}

function animate() {
  requestAnimationFrame(animate);
  for (const c in meshes) {
    const m = meshes[c], u = m.userData;
    u.y += (u.target - u.y) * 0.09;
    if (Math.abs(u.target - u.y) < 0.002) u.y = u.target;
    m.position.y = u.y;
    const s = stalks[c], pos = s.line.geometry.attributes.position;
    pos.setY(1, u.y); pos.needsUpdate = true;
    s.line.visible = Math.abs(u.y) > 0.3;
    plabels[c].position.y = u.y + 0.9;
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

const KEY = [1, 5, 13, 27, 46];

function updateScene(R) {
  if (!renderer) return;
  const t = T[state.lang];
  const used = {};
  for (const c in meshes) {
    const r = R.res[c], m = meshes[c];
    let target = 0, color = C_SAME;
    if (typeof r.year === "number") { target = yOfYear(r.year); }
    else if (r.year === "record") { target = Y_RECORD; }
    else if (r.year === "low") { target = yOfYear(1920); }
    const nowPop = byCode[c].pop2025;
    if (r.pop > nowPop) color = C_UP; else if (r.pop < nowPop) color = C_DOWN;
    m.userData.target = target;
    m.material.color.copy(color);
    m.material.emissive = new THREE.Color(+c === state.sel ? 0x222222 : 0x000000);
    used[typeof r.year === "number" ? r.year : r.year === "record" ? "record" : 2025] = true;
    // labels
    const p = byCode[c], lab = plabels[c];
    const show = KEY.includes(+c) || +c === state.sel;
    lab.visible = show;
    lab.element.className = "pl" + (+c === state.sel ? " sel" : "");
    if (show) {
      const yr = r.year;
      const v = yr === "record" ? t.record : yr === "same" ? t.same : yr === "low" ? t.low : (state.lang === "ja" ? yr + "年" : yr);
      lab.element.textContent = `${state.lang === "ja" ? p.ja.replace(/[都府県]$/, "") : p.en} ${v}`;
    }
  }
  for (const k in yearLabels) {
    const { div, mat } = yearLabels[k];
    if (+k !== 2025) mat.opacity = used[k] ? .45 : .14;
    div.textContent = k === "record" ? t.recLayer : (+k === 2025 ? t.today : (state.lang === "ja" ? k + "年" : k));
    div.classList.toggle("on", !!used[k]);
  }
}

// ------------------------------------------------------------- panel
const NS = "http://www.w3.org/2000/svg";
const el = (tag, attrs = {}, parent) => {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
};
function chart(p, r) {
  const W = 420, H = 230, m = { l: 52, r: 14, t: 16, b: 26 };
  const ys = DATA.years.filter(y => p.series[y] != null);
  const pts = ys.map(y => [y, p.series[y]]).concat([[2025, p.pop2025]]);
  const vals = pts.map(d => d[1]).concat([r.pop]);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  const padv = (hi - lo) * .08; lo = Math.max(0, lo - padv); hi += padv;
  const X = y => m.l + (y - 1920) / (2025 - 1920) * (W - m.l - m.r);
  const Y = v => m.t + (hi - v) / (hi - lo) * (H - m.t - m.b);
  const s = document.createElementNS(NS, "svg");
  s.setAttribute("viewBox", `0 0 ${W} ${H}`);
  s.setAttribute("role", "img");
  // axes
  el("line", { x1: m.l, y1: H - m.b, x2: W - m.r, y2: H - m.b, stroke: "#000", "stroke-width": .8 }, s);
  [1920, 1950, 1980, 2000, 2025].forEach(y => {
    el("line", { x1: X(y), y1: H - m.b, x2: X(y), y2: H - m.b + 4, stroke: "#000", "stroke-width": .8 }, s);
    const t = el("text", { x: X(y), y: H - 6, "text-anchor": "middle" }, s); t.textContent = y;
  });
  const step = niceStep((hi - lo) / 4);
  for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) {
    el("line", { x1: m.l - 4, y1: Y(v), x2: m.l, y2: Y(v), stroke: "#000", "stroke-width": .8 }, s);
    const t = el("text", { x: m.l - 7, y: Y(v) + 4, "text-anchor": "end" }, s);
    t.textContent = state.lang === "ja" ? (v >= 1e8 ? (v / 1e8).toFixed(1) + "億" : Math.round(v / 1e4).toLocaleString("ja") + "万") : (v >= 1e6 ? (v / 1e6).toFixed(v % 1e6 ? 1 : 0) + "M" : Math.round(v / 1e3) + "k");
  }
  // series, broken at the 1945 gap
  const seg = (arr, dash) => el("polyline", { points: arr.map(d => `${X(d[0])},${Y(d[1])}`).join(" "), fill: "none", stroke: "#000", "stroke-width": 1.4, "stroke-dasharray": dash || "" }, s);
  const before = pts.filter(d => d[0] <= 1940), after = pts.filter(d => d[0] >= 1950);
  if (before.length) seg(before);
  if (before.length && after.length) seg([before[before.length - 1], after[0]], "2 3");
  seg(after);
  pts.forEach(d => el("circle", { cx: X(d[0]), cy: Y(d[1]), r: 2, fill: "#000" }, s));
  // new population
  el("line", { x1: m.l, y1: Y(r.pop), x2: X(2025), y2: Y(r.pop), stroke: "#000", "stroke-width": 1, "stroke-dasharray": "4 3" }, s);
  el("line", { x1: X(2025), y1: Y(p.pop2025), x2: X(2025), y2: Y(r.pop), stroke: "#000", "stroke-width": 2 }, s);
  el("circle", { cx: X(2025), cy: Y(r.pop), r: 4, fill: "#f4f1ea", stroke: "#000", "stroke-width": 1.6 }, s);
  if (typeof r.year === "number") {
    el("circle", { cx: X(r.year), cy: Y(p.series[r.year]), r: 6.5, fill: "none", stroke: "#000", "stroke-width": 1.6 }, s);
  }
  return s;
}
function niceStep(x) {
  const e = Math.pow(10, Math.floor(Math.log10(x))), f = x / e;
  return (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * e;
}

function renderPanel(R) {
  const t = T[state.lang], p = byCode[state.sel], r = R.res[state.sel];
  const panel = document.getElementById("panel");
  panel.innerHTML = "";
  const h = document.createElement("h2"); h.textContent = t.name(p); panel.appendChild(h);
  const a = document.createElement("p"); a.className = "alt"; a.textContent = t.alt(p); panel.appendChild(a);
  const big = document.createElement("p");
  big.className = "big" + (r.pop > p.pop2025 ? " up" : r.pop < p.pop2025 ? " down" : "");
  const lab = document.createElement("small");
  if (typeof r.year === "number") { lab.textContent = t.backTo; big.append(lab, state.lang === "ja" ? `${r.year}年` : String(r.year)); }
  else if (r.year === "record") { lab.textContent = t.recordSub; big.append(t.record); big.appendChild(lab); lab.style.marginTop = "4px"; }
  else if (r.year === "low") { big.append(t.low); }
  else { big.append(t.same); }
  panel.appendChild(big);
  const dl = document.createElement("dl");
  const row = (k, v) => { const dt = document.createElement("dt"), dd = document.createElement("dd"); dt.textContent = k; dd.textContent = v; dl.append(dt, dd); };
  row(t.rows.akiya, fmtN(p.akiya, state.lang));
  row(t.rows.pph, p.pph.toFixed(2));
  row(t.rows.pop2025, fmtN(p.pop2025, state.lang));
  if (r.out) row(t.rows.out, "−" + fmtN(r.out, state.lang)); else row(t.rows.move, "+" + fmtN(r.add, state.lang));
  row(t.rows.newPop, fmtN(r.pop, state.lang));
  panel.appendChild(dl);
  const c = document.createElement("div"); c.className = "chart"; c.appendChild(chart(p, r)); panel.appendChild(c);
  const n = document.createElement("p"); n.className = "hint";
  n.textContent = t.chartNote(typeof r.year === "number" ? r.year : null);
  if (r.out) n.textContent += " " + t.sending;
  if (state.scen === "B" && state.sel === DATA.tokyo) n.textContent += " " + t.tokyoB;
  panel.appendChild(n);
}

// ------------------------------------------------------------- update
function update() {
  const t = T[state.lang];
  const R = compute();
  updateScene(R);
  const pct = Math.round(state.rate * 100);
  document.getElementById("rateOut").textContent = pct + "%";
  document.getElementById("vsThumb").style.bottom = pct + "%";
  document.getElementById("vsFill").style.height = pct + "%";
  const vs = document.getElementById("vslider");
  vs.setAttribute("aria-valuenow", pct); vs.setAttribute("aria-valuetext", pct + "%"); vs.setAttribute("aria-label", t.rate);
  document.getElementById("moversOut").textContent = t.movers(R.movers);
  const nat = document.getElementById("national"), sub = document.getElementById("nationalSub");
  const peak = Math.max(...Object.values(DATA.national.series));
  const peakY = Object.keys(DATA.national.series).find(y => DATA.national.series[y] === peak);
  if (R.nat.year === "same") { nat.textContent = t.natSame; sub.textContent = state.scen === "A" ? "" : t.natSubSame; }
  else if (R.nat.year === "record") { nat.textContent = t.natRecord(R.nat.pop); sub.textContent = t.natSubRecord(peak, peakY); }
  else { nat.textContent = t.natBack(R.nat.pop, R.nat.year); sub.textContent = ""; }
  renderPanel(R);
}

function select(code) { state.sel = +code; update(); }

function setLang(lang) {
  state.lang = lang;
  document.documentElement.lang = lang;
  document.body.classList.toggle("ja", lang === "ja");
  document.querySelectorAll("[data-lang]").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));
  const t = T[lang];
  document.querySelectorAll("[data-t]").forEach(e => { const v = t[e.dataset.t]; if (typeof v === "string") e.textContent = v; });
  const fill = (id, arr) => { const ul = document.getElementById(id); ul.innerHTML = ""; arr.forEach(n => { const li = document.createElement("li"); li.textContent = n; ul.appendChild(li); }); };
  fill("notes", t.notes); fill("sources", t.sources);
  const lg = document.getElementById("legend"); lg.innerHTML = "";
  const tt = document.createElement("span"); tt.className = "t"; tt.textContent = t.legendT; lg.appendChild(tt);
  [["up", "#1f8a4c"], ["down", "#c8312a"], ["rec", "linear-gradient(#f0ebe0,#f0ebe0)"], ["same", "#fbfaf6"]].forEach(([k, c]) => {
    const sp = document.createElement("span"); const i = document.createElement("i"); i.style.background = c;
    sp.append(i, t.legend[k]); lg.appendChild(sp);
  });
  update();
}

document.querySelectorAll("[data-lang]").forEach(b => b.addEventListener("click", () => setLang(b.dataset.lang)));
document.querySelectorAll("#scenarios button").forEach(b => b.addEventListener("click", () => {
  state.scen = b.dataset.s;
  document.querySelectorAll("#scenarios button").forEach(x => x.setAttribute("aria-pressed", x === b));
  update();
}));
// vertical slider
function setRate(pct) {
  pct = Math.max(0, Math.min(100, Math.round(pct / 5) * 5));
  if (pct === Math.round(state.rate * 100)) return;
  state.rate = pct / 100; update();
}
(() => {
  const track = document.getElementById("vsTrack"), vs = document.getElementById("vslider");
  let dragging = false;
  const fromY = e => { const r = track.getBoundingClientRect(); return (1 - (e.clientY - r.top) / r.height) * 100; };
  track.addEventListener("pointerdown", e => { dragging = true; track.setPointerCapture(e.pointerId); setRate(fromY(e)); vs.focus({ preventScroll: true }); });
  track.addEventListener("pointermove", e => { if (dragging) setRate(fromY(e)); });
  track.addEventListener("pointerup", () => { dragging = false; });
  track.addEventListener("pointercancel", () => { dragging = false; });
  vs.addEventListener("keydown", e => {
    const now = Math.round(state.rate * 100);
    const k = { ArrowUp: 5, ArrowRight: 5, ArrowDown: -5, ArrowLeft: -5, PageUp: 25, PageDown: -25 }[e.key];
    if (k !== undefined) { e.preventDefault(); setRate(now + k); }
    else if (e.key === "Home") { e.preventDefault(); setRate(0); }
    else if (e.key === "End") { e.preventDefault(); setRate(100); }
  });
})();

Promise.all(["data/akiya.json", "data/prefectures.geojson", "data/coast.json"].map(u => fetch(u).then(r => r.json())))
  .then(([d, g, c]) => {
    DATA = d; GEO = g; COAST = c;
    DATA.prefs.forEach(p => byCode[p.code] = p);
    buildScene();
    let lang = "en";
    try { const q = new URLSearchParams(location.search).get("lang"); if (q === "ja" || (!q && navigator.language.startsWith("ja"))) lang = "ja"; } catch (e) {}
    setLang(lang);
  });
</script>
